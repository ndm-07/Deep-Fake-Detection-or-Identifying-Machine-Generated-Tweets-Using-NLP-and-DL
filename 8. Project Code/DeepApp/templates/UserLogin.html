{% load static %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta name="description" content="" />
	<meta name="keywords" content="" />
	<title>Deep Fake Detection</title>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}" />
	<script language="javascript">
		function validate(formObj) {
			if (formObj.t1.value.length == 0) {
				alert("Please Enter User ID");
				formObj.t1.focus();
				return false;
			}
			if (formObj.t2.value.length == 0) {
				alert("Please Enter Password");
				formObj.t2.focus();
				return false;
			}
			return true;
		}
	</script>
</head>

<body>
	<div id="wrapper">
		<div id="header">
			<div id="logo">
				<center>
					<font size="5" color="white">Deepfake Detection for Identifying Machine-generated Tweets Using NLP
						and DL
					</font>
				</center>
			</div>
			<div id="slogan">

			</div>
		</div>
		<div id="menu">
			<ul>
				<center>
					<li class="first current_page_item"><a href="{% url 'index' %}"
							style="font-size: 25px; color: red;">Home</a></li>

					<li class="first current_page_item"><a href="{% url 'list_users' %}"
							style="font-size: 25px; color: red;">
							Manage Users
						</a></li>
					<!-- <li class="first current_page_item"><a href="{% url 'UserLogin' %}"><font size="5" color="red">User Login Here</font></a></li> -->
				</center>
			</ul> <br class="clearfix" />
		</div>

		<!-- <div id="splash">
		<img class="pic" src="{% static 'images/img05.jpg' %}" width="870" height="250" alt="" />
	</div>	
			<center>  -->
		<form name="f1" method="post" action={% url 'UserLoginAction' %} onsubmit="return validate(this);">
			<br>{% csrf_token %}<br>
			<h1 style="text-align: center; height: 50px; background-color: beige; padding-top: 20px;">
				<b>Login Screen</b></font>
			</h1><br>

			<h3 style="font-size: 20px; color: red; text-align: center;">{{ data|safe }}</h3>


			<table style="margin: auto; width: 45%; border-collapse: collapse; font-family: 'Times New Roman', Times, serif;">
				<tr>
					<td style="font-size: 18px; color: black; padding: 8px;">Email ID</td>
					<td><input type="email" name="t1"
							style="font-family: 'Comic Sans MS', cursive; font-size: 16px; width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px;" />
					</td>
				</tr>
				<tr>
					<td style="font-size: 18px; color: black; padding: 8px;">Password</td>
					<td><input type="password" name="t2"
							style="font-family: 'Comic Sans MS', cursive; font-size: 16px; width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px;" />
					</td>
				</tr>
			</table>

			<div style="text-align: center; padding-top: 10px;padding-right: 140px;">
				<input type="submit" value="Login" style="background-color: #4CAF50; color: white; font-size: 16px; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; transition: all 0.3s ease;"
							onmouseover="this.style.backgroundColor='#388E3C'; this.style.transform='scale(1.05)'; this.style.boxShadow='3px 3px 10px rgba(0, 0, 0, 0.3)';"
							onmouseout="this.style.backgroundColor='#4CAF50'; this.style.transform='scale(1)'; this.style.boxShadow='none';">
			</div>
			
			<br>
			<p style="text-align: center; font-size: 16px;">
				<a href="{% url 'UserRegisterAction' %}" style="color: blue; text-decoration: none; ">
					<u>New user? &nbsp; Register here</u>
				</a>

			</p>
			<br>
	</div>

	</div>
	<br /><br />
</body>

</html>
